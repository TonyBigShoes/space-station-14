- type: entity
  abstract: true
  parent: BaseStructure
  id: BaseBonfire
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        mask:
        - Impassable
        layer:
        - Opaque
        - BulletImpassable
  - type: Sprite
    noRot: true
    sprite: Structures/Decoration/bonfire.rsi
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: RequireProjectileTarget

- type: entity
  parent: BaseBonfire
  id: BonfireLit
  suffix: Lit
  name: bonfire
  description: What can be better than a late evening under the sky with guitar and friends?
  components:
  - type: Sprite
    layers:
    - state: burning
  - type: IgnitionSource
    temperature: 700
    ignited: true
  - type: AmbientSound
    volume: -5
    range: 5
    sound:
      path: /Audio/Ambience/Objects/fireplace.ogg
  - type: PointLight
    radius: 5
    energy: 3
    color: "#FFC90C"

- type: entity
  parent: BaseBonfire
  id: BonfireUnlit
  suffix: Unlit
  name: bonfire
  description: Just needs a little bit of fire to get started
  components:
  - type: Sprite
    layers:
    - state: bonfire
  - type: Construction
    graph: Bonfire
    node: bonfire
